groove, 20 mm wide, 7 mm deep</button><button type="button" class="plt-key" data-key="s-T-w3-d8_511" aria-pressed="true"><svg viewBox="0 0 34 12" aria-hidden="true"><line x1="1" y1="6" x2="33" y2="6" stroke="var(--green)" stroke-width="2.3" stroke-dasharray="1.6 3.2"/></svg>Through cut, 3 mm wide</button><button type="button" class="plt-key" data-key="s-T-w20-d8_511" aria-pressed="true"><svg viewBox="0 0 34 12" aria-hidden="true"><line x1="1" y1="6" x2="33" y2="6" stroke="var(--sky)" stroke-width="1.9" stroke-dasharray="9 3 2 3 2 3"/></svg>Through cut, 20 mm wide</button><button type="button" class="plt-key" data-key="b20" aria-pressed="true"><svg viewBox="0 0 34 12" aria-hidden="true"><rect x="1" y="1" width="32" height="10" fill="var(--band-green)" fill-opacity="var(--band-green-o)" stroke="var(--band-green)" stroke-width=".6"/></svg>Inside ±20 mT</button><button type="button" class="plt-key" data-key="b30" aria-pressed="true"><svg viewBox="0 0 34 12" aria-hidden="true"><rect x="1" y="1" width="32" height="10" fill="var(--band-orange)" fill-opacity="var(--band-orange-o)" stroke="var(--band-orange)" stroke-width=".6"/></svg>Inside ±30 mT</button><button type="button" class="plt-key" data-key="l0" aria-pressed="true"><svg viewBox="0 0 34 12" aria-hidden="true"><line x1="1" y1="6" x2="33" y2="6" stroke="var(--grey)" stroke-width="1.8"/></svg>B_z = 0</button></div><div class="plt-text"><h4>About this plot</h4><p>Across: lift-off, the distance from the rope surface out to the axial sensor part (a magnetoresistive field sensor), in millimetres; up: B_z, the field along the rope at the head&#x27;s middle cross-section (the mid-plane) with an intact rope, called the standing field, in millitesla (mT). Look at where each curve runs inside the green band: there the sensor part, read through its package, stays within its specified range. Without a cut-out the field is inside only far from the rope; every cut-out shown drives the field through zero nearer the rope, so the band becomes a window of lift-offs rather than everything beyond one point. It shows the standing field only, not the signals from rope damage; every cut-out also lowers the rope induction, how hard the magnet drives magnetic flux through the rope, in tesla (T) (in each curve&#x27;s text). The head is a ring of magnets in a steel shell (the yoke) round the rope; calculated, not measured: a two-dimensional, round-symmetric computer model of the head sized for a 40 mm rope, with a 40 mm rope in it, assumed (not measured) steel and magnet data, 25 °C, the magnet not made stronger to make up for a cut.</p><h4>What each line, band and mark is</h4><dl><dt>No cut-out</dt><dd>The yoke left whole. The standing field is negative all the way from the rope to the yoke and comes inside ±20 mT only from 13.0 mm lift-off; the rope runs at 1.936 T at the mid-plane.</dd><dt>Inner groove, 30 mm wide, 5 mm deep</dt><dd>A groove all the way round in the yoke&#x27;s inner face (towards the rope), 30 mm wide along the rope and 5 mm deep into the 8.5 mm yoke. Rope induction −3.5 % against no cut-out. Inside ±20 mT: 3.5–15.5 mm.</dd><dt>Outer groove, 10 mm wide, 5 mm deep</dt><dd>A groove all the way round in the yoke&#x27;s outer face, 10 mm wide along the rope and 5 mm deep into the 8.5 mm yoke. Rope induction −2.8 % against no cut-out. Inside ±20 mT: 4.0–13.5 mm.</dd><dt>Outer groove, 18 mm wide, 5 mm deep</dt><dd>A groove all the way round in the yoke&#x27;s outer face, 18 mm wide along the rope and 5 mm deep into the 8.5 mm yoke. Rope induction −3.6 % against no cut-out. Inside ±20 mT: 3.0–12.5 mm.</dd><dt>Outer groove, 20 mm wide, 7 mm deep</dt><dd>A groove all the way round in the yoke&#x27;s outer face, 20 mm wide along the rope and 7 mm deep into the 8.5 mm yoke. Rope induction −8.2 % against no cut-out. Inside ±20 mT: 3.0–7.0 mm.</dd><dt>Through cut, 3 mm wide</dt><dd>A ring 3 mm wide (along the rope) cut right through the yoke, which is 8.5 mm thick; the model takes it all the way round. Rope induction −4.4 % against no cut-out. Inside ±20 mT: 3.0–10.0 mm.</dd><dt>Through cut, 20 mm wide</dt><dd>A ring 20 mm wide (along the rope) cut right through the yoke, which is 8.5 mm thick; the model takes it all the way round. Rope induction −12.4 % against no cut-out. Inside ±20 mT: 3.0–4.5 mm.</dd><dt>Inside ±20 mT</dt><dd>The range the sensor part is specified for when it is read through its package.</dd><dt>Inside ±30 mT</dt><dd>About where that sensor part saturates: outside this band it no longer follows the field.</dd><dt>B_z = 0</dt><dd>Where the field along the rope changes direction. Beyond it a cut-out&#x27;s field grows again, the other way.</dd></dl><p class="plt-src">Source of the numbers: sws/3d/results/yoke_cutout_H40_d40_hard_+25C_*.json, the same files as the static figure sws/3d/figures/yoke_cutout.png; explanations in sws/3d/demo/interactive_figures.py.</p></div><script type="application/json" class="plt-data">{"kind":"line","about":["Across: lift-off, the distance from the rope surface out to the axial sensor part (a magnetoresistive field sensor), in millimetres; up: B_z, the field along the rope at the head's middle cross-section (the mid-plane) with an intact rope, called the standing field, in millitesla (mT).","Look at where each curve runs inside the green band: there the sensor part, read through its package, stays within its specified range.","Without a cut-out the field is inside only far from the rope; every cut-out shown drives the field through zero nearer the rope, so the band becomes a window of lift-offs rather than everything beyond one point.","It shows the standing field only, not the signals from rope damage; every cut-out also lowers the rope induction, how hard the magnet drives magnetic flux through the rope, in tesla (T) (in each curve's text).","The head is a ring of magnets in a steel shell (the yoke) round the rope; calculated, not measured: a two-dimensional, round-symmetric computer model of the head siz
