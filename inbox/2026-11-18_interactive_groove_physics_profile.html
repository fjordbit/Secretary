lt-key" data-key="s-O-w20-d3" aria-pressed="true"><svg viewBox="0 0 34 12" aria-hidden="true"><line x1="1" y1="6" x2="33" y2="6" stroke="var(--sky)" stroke-width="2.0" stroke-dasharray="7 4"/></svg>Outer groove 20 mm wide, 3 mm deep</button><button type="button" class="plt-key" data-key="s-O-w20-d4" aria-pressed="true"><svg viewBox="0 0 34 12" aria-hidden="true"><line x1="1" y1="6" x2="33" y2="6" stroke="var(--orange)" stroke-width="2.0" stroke-dasharray="9 3 2 3"/></svg>Outer groove 20 mm wide, 4 mm deep</button><button type="button" class="plt-key" data-key="s-O-w20-d5" aria-pressed="true"><svg viewBox="0 0 34 12" aria-hidden="true"><line x1="1" y1="6" x2="33" y2="6" stroke="var(--vermillion)" stroke-width="2.0"/></svg>Outer groove 20 mm wide, 5 mm deep</button><button type="button" class="plt-key" data-key="s-O-w20-d6" aria-pressed="true"><svg viewBox="0 0 34 12" aria-hidden="true"><line x1="1" y1="6" x2="33" y2="6" stroke="var(--purple)" stroke-width="2.4" stroke-dasharray="1.6 3.2"/></svg>Outer groove 20 mm wide, 6 mm deep</button><button type="button" class="plt-key" data-key="g-zero" aria-pressed="true"><svg viewBox="0 0 34 12" aria-hidden="true"><circle cx="17" cy="6" r="4" fill="var(--fg)"/></svg>Zero of B_z (dots)</button><button type="button" class="plt-key" data-key="b-rope" aria-pressed="true"><svg viewBox="0 0 34 12" aria-hidden="true"><rect x="1" y="1" width="32" height="10" fill="var(--band-grey)" fill-opacity="var(--band-grey-o)" stroke="var(--band-grey)" stroke-width=".6"/></svg>Rope</button><button type="button" class="plt-key" data-key="b-yoke" aria-pressed="true"><svg viewBox="0 0 34 12" aria-hidden="true"><rect x="1" y="1" width="32" height="10" fill="var(--band-blue)" fill-opacity="var(--band-blue-o)" stroke="var(--band-blue)" stroke-width=".6"/></svg>Yoke</button><button type="button" class="plt-key" data-key="l0" aria-pressed="true"><svg viewBox="0 0 34 12" aria-hidden="true"><line x1="1" y1="6" x2="33" y2="6" stroke="var(--grey)" stroke-width="1.8"/></svg>Zero</button></div><div class="plt-text"><h4>About this plot</h4><p>Across: the distance from the rope&#x27;s centre line outward at the head&#x27;s middle cross-section (the mid-plane), in millimetres; up: μ0·H_z, the field strength along the rope (H_z) times the magnetic constant μ0, in millitesla (mT), so that it can be read on the same scale as the field B_z; lift-off is the distance out from the rope surface, which is at radius 20 mm. In the air between rope and yoke it is the same as B_z, the field a sensor part there would read; inside the rope and the yoke it is the field strength in the steel. Look at where each curve crosses zero (the dots): the deeper the groove, the nearer the rope that zero sits, because the thin steel left over a groove saturates and needs a large field strength, which carries across the air. The curves run without a step through the rope surface and the yoke face: in the model the field strength along a steel surface is the same on both sides of it. The head is a ring of magnets in a steel shell (the yoke) round the rope; calculated, not measured: a two-dimensional, round-symmetric computer model of the head sized for a 40 mm rope, with a 40 mm rope in it, assumed (not measured) steel and magnet data, 25 °C, the magnet not made stronger to make up for a cut. Mid-plane only.</p><h4>What each line, band and mark is</h4><dl><dt>No groove</dt><dd>The yoke left whole (8.5 mm of steel at 1.28 T, far from saturation), so it needs almost no field strength and the curve reaches zero just in front of the yoke face, at 22.7 mm lift-off.</dd><dt>Outer groove 20 mm wide, 3 mm deep</dt><dd>Leaves 5.5 mm of steel over the groove, at 1.85 T, saturated, so a large field strength is needed there; the zero moves in to 16.6 mm lift-off (no groove: 22.7 mm).</dd><dt>Outer groove 20 mm wide, 4 mm deep</dt><dd>Leaves 4.5 mm of steel over the groove, at 1.97 T, saturated, so a large field strength is needed there; the zero moves in to 11.8 mm lift-off (no groove: 22.7 mm).</dd><dt>Outer groove 20 mm wide, 5 mm deep</dt><dd>Leaves 3.5 mm of steel over the groove, at 2.04 T, saturated, so a large field strength is needed there; the zero moves in to 8.0 mm lift-off (no groove: 22.7 mm).</dd><dt>Outer groove 20 mm wide, 6 mm deep</dt><dd>Leaves 2.5 mm of steel over the groove, at 2.09 T, saturated, so a large field strength is needed there; the zero moves in to 5.1 mm lift-off (no groove: 22.7 mm).</dd><dt>Zero of B_z (dots)</dt><dd>Each dot, in its curve&#x27;s colour, marks where the field along the rope is zero for that curve: the lift-off at which a sensor part sees no standing field.</dd><dt>Zero of B_z, no groove</dt><dd>Where the field along the rope is zero: 22.7 mm out from the rope surface (radius 42.7 mm). A sensor part here would see no standing field in the model.</dd><dt>Zero of B_z, outer groove 20 mm wide, 3 mm deep</dt><dd>Where the field along the rope is zero: 16.6 mm out from the rope surface (radius 36.6 mm). A sensor part here would see no standing field in the model.</dd><dt>Zero of B_z, outer groove 20 mm wide, 4 mm deep</dt><dd>Where the field along the rope is zero: 11.8 mm out from the rope surface (radius 31.8 mm). A sensor part here would see no standing field in the model.</dd><dt>Zero of B_z, outer groove 20 mm wide, 5 mm deep</dt><dd>Where the field along the rope is zero: 8.0 mm out from the rope surface (radius 28.0 mm). A sensor part here would see no standing field in the model.</dd><dt>Zero of B_z, outer groove 20 mm wide, 6 mm deep</dt><dd>Where the field along the rope is zero: 5.1 mm out from the rope surface (radius 25.1 mm). A sensor part here would see no standing field in the model.</dd><dt>Rope</dt><dd>The steel rope, radius 0 to 20.0 mm. Here the curve is the field strength inside the rope, not a field a sensor could read.</dd><dt>Yoke</dt><dd>The steel shell round the magnets, radius 43.2 to 51.7 mm (8.5 mm thick). Over an outer groove its outer part is air; the curve then shows the field strength in the steel left and in the groove.</dd><dt>Zero</dt><dd>Zero field strength. Where a curve crosses this line in the air, B_z is zero.</dd></dl><p class="plt-src">Source of the numbers: sws/3d/results/groove_physics_H40_d40_hard_+25C_physics.json, the same file as the static figure sws/3d/figures/groove_physics_profile.png; explanations in sws/3d/demo/interactive_figures.py.</p></div><script type="application/json" class="plt-data">{"kind":"line","about":["Across: the distance from the rope's centre line outward at the head's middle cross-section (the mid-plane), in millimetres; up: μ0·H_z, the field strength along the rope (H_z) times the magnetic constant μ0, in millitesla (mT), so that it can be read on the same scale as the field B_z; lift-off is the distance out from the rope surface, which is at radius 20 mm.","In the air between rope and yoke it is the same as B_z, the field a sensor part there would read; inside the rope and the yoke it is the field strength in the steel.","Look at where each curve crosses zero (the dots): the deeper the groove, the nearer the rope that zero sits, because the thin steel left over a groove saturates and needs a large field strength, which carries across the air.","The curves run without a step through the rope surface and the yoke face: in the model the field strength along a steel surface is the same on both sides of it.","The head is a ring of magnets in a steel shell (the yoke) round the rope; calculated, not measured: a two-dimensional, round-symmetric computer model of the head sized for a 40 mm rope, with a 40 mm rope in it, assumed (not measured) steel and magnet data, 25 °C, the magnet not made stronger to make up for a cut. Mid-plane only."],"x":{"name":"radius","unit":"mm","dp":1},"y":{"name":"μ0·H_z","unit":"mT","dp":1},"frame":{"l":62,"t":12,"w":640,"h":360,"r":14,"b":46,"x0":0,"x1":57.7,"y0":-60,"y1":100},"items":{"s-ref":{"name":"No groove","explain":"The yoke left whole (8 ab.addEventListener('mouseenter',about);ab.addEventListener('focus',about);ab.addEventListener('mouseleave',hide);ab.addEventListener('blur',hide);
ab.addEventListener('click',function(e){e.stopPropagation();about()});
document.addEventListener('click',function(e){if(!F.contains(e.target))hide()});
F.addEventListener('keydown',function(e){if(e.key==='Escape')hide()});
var keys=F.querySelectorAll('.plt-key');
function item(k){return D.items[k]}
function vis(k){var e=F.querySelector('[data-k="'+((D.items[k]&&D.items[k].group)||k)+'"]');return!!e&&!e.classList.contains('off')}
keys.forEach(function(b){var k=b.dataset.key,it=item(k);
 function show(){var r=b.getBoundingClientRect();F.querySelectorAll('[data-k="'+k+'"]').forEach(function(g){g.classList.add('hi')});
  tip('<b>'+esc(it.name)+(b.getAttribute('aria-pressed')==='false'?' (now hidden; select again to show)':'')+'</b>'+esc(it.explain)+
  (it.kind==='series'&&D.kind==='line'?'<span class="v">Arrow keys: read the values along this curve. Enter: hide or show.</span>':''),r.left,r.bottom)}
 b.addEventListener('mouseenter',show);b.addEventListener('focus',show);b.addEventListener('mouseleave',hide);b.addEventListener('blur',hide);
 b.addEventListener('click',function(e){e.stopPropagation();var on=b.getAttribute('aria-pressed')!=='false';b.setAttribute('aria-pressed',on?'false':'true');
  F.querySelectorAll('[data-k="'+k+'"]').forEach(function(g){g.classList.toggle('off',on)});hide();show()});
 if(D.kind==='line'&&it.kind==='series'){var j=-1;b.addEventListener('keydown',function(e){if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;
  e.preventDefault();if(b.getAttribute('aria-pressed')==='false')return;var P=D.frame,ok=[];for(var i=0;i<it.x.length;i++){if(it.x[i]>=P.x0&&it.x[i]<=P.x1&&it.y[i]!==null&&it.y[i]>=P.y0&&it.y[i]<=P.y1)ok.push(i)}if(!ok.length)return;var n=ok.length;j=j<0?0:Math.max(0,Math.min(n-1,j+(e.key==='ArrowRight'?1:-1)));var jj=ok[j];
  var svg=F.querySelector('svg.plt-main');var X=P.l+(it.x[jj]-P.x0)/(P.x1-P.x0)*P.w,Y=P.t+(P.y1-it.y[jj])/(P.y1-P.y0)*P.h;
  cursor(X,Y);var s=scr(svg,X,Y);tip('<b>'+esc(it.name)+'</b>'+esc(it.explain)+'<span class="v">'+esc(D.x.name)+' '+f(it.x[jj],D.x.dp)+' '+esc(D.x.unit)+': '+
  esc(D.y.name)+' '+f(it.y[jj],D.y.dp)+' '+esc(D.y.unit)+'</span>',s[0],s[1])})}
});
function cursor(X,Y){var c=F.querySelector('.cur'),d=F.querySelector('.curdot');if(!c)return;c.setAttribute('x1',X);c.setAttribute('x2',X);
 c.setAttribute('visibility','visible');if(Y===null){d.setAttribute('visibility','hidden')}else{d.setAttribute('cx',X);d.setAttribute('cy',Y);d.setAttribute('visibility','visible')}}
if(D.kind==='line'){
 var svg=F.querySelector('svg.plt-main'),P=D.frame;
 function at(e){var q=pt(svg,e);if(q.x<P.l||q.x>P.l+P.w||q.y<P.t||q.y>P.t+P.h){hide();return}
  var x=P.x0+(q.x-P.l)/P.w*(P.x1-P.x0),y=P.y1-(q.y-P.t)/P.h*(P.y1-P.y0),best=null,bd=1e9;
  F.querySelectorAll('.hi').forEach(function(g){g.classList.remove('hi')});
  Object.keys(D.items).forEach(function(k){var it=D.items[k];if(!vis(k))return;
   if(it.kind==='point'){var X=P.l+(it.x-P.x0)/(P.x1-P.x0)*P.w,Y=P.t+(P.y1-it.y)/(P.y1-P.y0)*P.h,dd=Math.hypot(X-q.x,Y-q.y)-4;if(dd<bd){bd=dd;best=[k,it.y,X]}}
   if(it.kind==='series'){var v=interp(it.x,it.y,x);if(v===null)return;var Y=P.t+(P.y1-v)/(P.y1-P.y0)*P.h,dd=Math.abs(Y-q.y);if(dd<bd){bd=dd;best=[k,v,null]}}});
  var unit=' '+esc(D.y.unit),xs=esc(D.x.name)+' '+f(x,D.x.dp)+' '+esc(D.x.unit);
  if(best&&bd<16){var it=D.items[best[0]];F.querySelectorAll('[data-k="'+(it.group||best[0])+'"]').forEach(function(g){g.classList.add('hi')});
   if(it.kind==='point'){tip('<b>'+esc(it.name)+'</b>'+esc(it.explain)+'<span class="v">'+esc(D.x.name)+' '+f(it.x,D.x.dp)+' '+esc(D.x.unit)+'</span>',e.clientX,e.clientY);return}
   var Y=P.t+(P.y1-best[1])/(P.y1-P.y0)*P.h;cursor(q.x,Y);
   tip('<b>'+esc(it.name)+'</b>'+esc(it.explain)+'<span class="v">'+xs+': '+esc(D.y.name)+' '+f(best[1],D.y.dp)+unit+'</span>',e.clientX,e.clientY);return}
  var h=[];Object.keys(D.items).forEach(function(k){var it=D.items[k];if(!vis(k))return;
   if(it.kind==='band'){var v=it.axis==='y'?y:x;if(v>=it.lo&&v<=it.hi)h.push('<b>'+esc(it.name)+'</b>'+esc(it.explain))}
   if(it.kind==='line'){var px=it.axis==='y'?P.t+(P.y1-it.at)/(P.y1-P.y0)*P.h:P.l+(it.at-P.x0)/(P.x1-P.x0)*P.w;
    if(Math.abs((it.axis==='y'?q.y:q.x)-px)<8)h.unshift('<b>'+esc(it.name)+'</b>'+esc(it.explain))}});
  cursor(q.x,null);
  tip((h.length?h.join('<br>'):'<b>No curve here</b>Move nearer a curve, or use the list under the plot.')+'<span class="v">Pointer: '+xs+', '+esc(D.y.name)+' '+f(y,D.y.dp)+unit+'</span>',e.clientX,e.clientY)}
 svg.addEventListener('pointermove',function(e){if(e.pointerType==='mouse'||e.pointerType==='pen')at(e)});
 svg.addEventListener('mouseleave',hide);
 svg.addEventListener('click',function(e){e.stopPropagation();at(e)});
}
if(D.kind==='map'){
 F.querySelectorAll('svg.plt-panel').forEach(function(svg){var pi=+svg.dataset.p,Pn=D.panels[pi],G=D.grids[Pn.grid],P=D.frame,ix=0,iy=0,st=0;
  function bil(Z,x,y){var X=G.x,Y=G.y;if(x<X[0]||x>X[X.length-1]||y<Y[0]||y>Y[Y.length-1])return null;var i=1,j=1;
   while(i<X.length-1&&X[i]<x)i++;while(j<Y.length-1&&Y[j]<y)j++;var tx=(x-X[i-1])/(X[i]-X[i-1]),ty=(y-Y[j-1])/(Y[j]-Y[j-1]);
   var a=Z[i-1][j-1],b=Z[i][j-1],c=Z[i-1][j],d=Z[i][j];if([a,b,c,d].some(function(v){return v===null}))return null;
   return a*(1-tx)*(1-ty)+b*tx*(1-ty)+c*(1-tx)*ty+d*tx*ty}
  function show(x,y,cx,cy){var h='<b>'+esc(Pn.title)+'</b><span class="v">'+esc(D.x.name)+' '+f(x,D.x.dp)+' '+esc(D.x.unit)+', '+esc(D.y.name)+' '+f(y,D.y.dp)+' '+esc(D.y.unit)+'</span>';
   D.values.forEach(function(v){if(v.panels&&v.panels.indexOf(Pn.row)<0)return;var z=v.along==='x'?interp(G.x,G[v.field],x):bil(G[v.field],x,y);
    h+='<span class="v">'+esc(v.name)+': '+f(z,v.dp)+(v.unit?' '+esc(v.unit):'')+(v.below!==undefined&&z!==null&&z<v.below?esc(v.below_note):'')+'</span>'});
   var inside=bil(G.inside,x,y);if(inside!==null)h+='<span class="v">'+(inside>=0.5?esc(D.inside_yes):esc(D.inside_no))+'</span>';
   h+='<span class="v" style="color:var(--muted)">'+esc(Pn.key)+'</span>';tip(h,cx,cy)}
  function at(e){var q=pt(svg,e);if(q.x<P.l||q.x>P.l+P.w||q.y<P.t||q.y>P.t+P.h){hide();return}
   var x=G.x[0]+(q.x-P.l)/P.w*(G.x[G.x.length-1]-G.x[0]),y=G.y[G.y.length-1]-(q.y-P.t)/P.h*(G.y[G.y.length-1]-G.y[0]);
   mark(svg,q.x,q.y);show(x,y,e.clientX,e.clientY)}
  svg.addEventListener('pointermove',function(e){if(e.pointerType==='mouse'||e.pointerType==='pen')at(e)});
  svg.addEventListener('mouseleave',hide);svg.addEventListener('click',function(e){e.stopPropagation();at(e)});
  svg.addEventListener('focus',function(){var r=svg.getBoundingClientRect();tip('<b>'+esc(Pn.title)+'</b>Arrow keys move a cross over the grid of computed points and read the values there.<span class="v" style="color:var(--muted)">'+esc(Pn.key)+'</span>',r.left,r.top+20)});
  svg.addEventListener('blur',hide);
  svg.addEventListener('keydown',function(e){var k=e.key;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].indexOf(k)<0)return;e.preventDefault();
   if(st){if(k==='ArrowRight')ix=Math.min(G.x.length-1,ix+1);if(k==='ArrowLeft')ix=Math.max(0,ix-1);if(k==='ArrowUp')iy=Math.min(G.y.length-1,iy+1);if(k==='ArrowDown')iy=Math.max(0,iy-1)}st=1;
   var X=P.l+(G.x[ix]-G.x[0])/(G.x[G.x.length-1]-G.x[0])*P.w,Y=P.t+(G.y[G.y.length-1]-G.y[iy])/(G.y[G.y.length-1]-G.y[0])*P.h;mark(svg,X,Y);
   var s=scr(svg,X,Y);show(G.x[ix],G.y[iy],s[0],s[1])});
 });
 function mark(svg,X,Y){F.querySelectorAll('.curdot').forEach(function(d){d.setAttribute('visibility','hidden')});var d=svg.querySelector('.curdot');
  d.setAttribute('cx',X);d.setAttribute('cy',Y);d.setAttribute('visibility','visible')}
}
})();
</script></figure>
