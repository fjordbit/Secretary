<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>51 ropes — fleet and rope mock-up</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: system-ui, sans-serif;
    font-size: 13px;
    color: #1c1917;
    background: #f4f1ea;
  }
  button, select { font: inherit; color: inherit; }
  #app { height: 100%; display: flex; flex-direction: column; min-height: 0; }
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 12px;
    padding: 6px 10px 2px;
    background: #fff;
    border-bottom: 1px solid #e6e2da;
  }
  header strong { font-size: 15px; }
  .muted { color: #57534e; }
  .stop {
    border: 1px solid #d6d3d1;
    border-radius: 99px;
    padding: 1px 8px;
    color: #44403c;
    font-size: 12px;
  }
  .hcounts { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; font-size: 12px; }
  .pill { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .ic { width: 11px; height: 11px; display: inline-block; vertical-align: -1px; flex: 0 0 auto; }
  .key, .legend, .formula, .note {
    margin: 0;
    padding: 3px 10px;
    color: #44403c;
    font-size: 12px;
    line-height: 1.35;
  }
  .grid {
    flex: 1 1 auto;
    min-height: 0;
    display: grid;
    grid-auto-flow: column;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    grid-template-rows: repeat(17, minmax(28px, 1fr));
    gap: 3px;
    padding: 4px 8px 8px;
    overflow: auto;
  }
  .card {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 1px;
    min-width: 0;
    overflow: hidden;
    text-align: left;
    cursor: pointer;
    background: #fff;
    border: 1px solid #e6e2da;
    border-left-width: 5px;
    border-radius: 2px;
    padding: 1px 6px;
  }
  .card:hover { border-color: #a8a29e; }
  .top, .bot { display: flex; align-items: center; gap: 6px; min-width: 0; white-space: nowrap; }
  .top .lv { font-weight: 700; }
  .name { font-weight: 650; width: 4.6em; flex: 0 0 auto; }
  .spacer { flex: 1 1 auto; }
  .bot { font-size: 12px; color: #44403c; font-variant-numeric: tabular-nums; }
  .lv-quiet { border-left-color: #1f7a3a; }
  .lv-watch { border-left-color: #8a5d00; background: #fffaf0; }
  .lv-inspect { border-left-color: #c2410c; background: #fff5f0; }
  .lv-discard {
    border-left-color: #9f1239;
    background-color: #fdf2f4;
    background-image: repeating-linear-gradient(-45deg, #fdf2f4, #fdf2f4 6px, #f8e6ea 6px, #f8e6ea 8px);
  }
  .lv-unknown { border-left-color: #475569; background: #f1f5f9; }
  .lv-discard .lv { color: #9f1239; }
  .lv-inspect .lv { color: #c2410c; }
  .lv-watch .lv { color: #8a5d00; }
  .lv-quiet .lv { color: #1f7a3a; font-weight: 600; }
  .lv-unknown .lv { color: #334155; }
  .eq-bad { box-shadow: inset 0 0 0 1px #64748b; }
  .c-sound { color: #1f7a3a; }
  .c-doubt { color: #8a5d00; font-weight: 700; }
  .c-nodata, .c-out { color: #334155; font-weight: 700; }
  #back, .run, select {
    background: #fff;
    border: 1px solid #d6d3d1;
    border-radius: 4px;
    padding: 2px 8px;
    cursor: pointer;
  }
  .run[aria-pressed="true"] { background: #1e3a5f; color: #fff; border-color: #1e3a5f; }
  .runs { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 10px 4px; }
  .rmeta { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 2px 10px; font-variant-numeric: tabular-nums; }
  .chart {
    flex: 1 1 auto;
    min-height: 140px;
    margin: 0 8px 8px;
    background: #fff;
    border: 1px solid #e6e2da;
  }
  .chart svg { width: 100%; height: 100%; display: block; }
  :focus-visible { outline: 2px solid #1d4ed8; outline-offset: 2px; }
  @media (min-width: 1700px) and (min-height: 1000px) {
    body { font-size: 16px; }
    .bot, .key, .legend, .formula, .note, .hcounts, .stop { font-size: 15px; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
var mode = "fleet";
var order = "place";
var openId = 7;
var runPick = 3;
var RANK = { discard: 0, unknown: 1, inspect: 2, watch: 3, quiet: 4 };
var LEVEL_WORD = {
  quiet: "Quiet",
  watch: "Watch",
  inspect: "Inspect",
  discard: "Discard guide",
  unknown: "Unknown"
};
var EQUIP_WORD = {
  sound: "Sound",
  doubt: "Doubt",
  nodata: "No data",
  out: "Out of service"
};
var NOTES = {
  7: "Loss of metal crosses the owner's 10% line near 80 m. This screen does not stop the winch.",
  14: "New local fault since the first run. Loss of metal has risen and is still under 10%.",
  19: "SWS A is in doubt: one axial channel fails its check. Readings are still used.",
  22: "Fatigue placeholder is high from cycles. Loss of metal is low, so the level stays Quiet.",
  27: "Much of this loss of metal was already on the first run, so drift is the smaller figure.",
  33: "SWS B is out of service. Rope figures are from SWS A only.",
  41: "Both SWS have no data. The rope level is Unknown. Cycles remain, from the winch.",
  48: "Local faults sit near 40 m while loss of metal stays low. They are kept apart."
};

function lcg(seed) {
  var s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return function () {
    s = (s * 16807) % 2147483647;
    return (s - 1) / 2147483646;
  };
}
function pad(n) { return (n < 10 ? "0" : "") + n; }
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function dateLabel(daysAgo) {
  var d = new Date(2026, 10, 20);
  var mon = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  d.setDate(d.getDate() - daysAgo);
  return d.getDate() + " " + mon[d.getMonth()] + " " + d.getFullYear();
}
function fmtFull(n) {
  var s = String(Math.round(n));
  var out = "";
  var i;
  for (i = 0; i < s.length; i++) {
    if (i > 0 && (s.length - i) % 3 === 0) out += " ";
    out += s.charAt(i);
  }
  return out;
}
function fmtCyc(n) {
  if (n >= 100000) return Math.round(n / 1000) + "k";
  if (n >= 10000) return (Math.round(n / 100) / 10) + "k";
  return fmtFull(n);
}
function fmtDrift(v) {
  if (v === null) return "\u2014";
  var t = (Math.round(v * 10) / 10).toFixed(1);
  return v > 0 ? "+" + t : t;
}
function icon(kind) {
  var p = {
    quiet: "<circle cx=\"7\" cy=\"7\" r=\"4.2\" fill=\"#1f7a3a\"/>",
    sound: "<circle cx=\"7\" cy=\"7\" r=\"4.2\" fill=\"#1f7a3a\"/>",
    watch: "<path fill=\"#8a5d00\" d=\"M7 1.8 L12.6 12.2 H1.4 Z\"/>",
    inspect: "<path fill=\"#c2410c\" d=\"M7 1.2 L12.8 7 L7 12.8 L1.2 7 Z\"/>",
    discard: "<rect x=\"2.4\" y=\"2.4\" width=\"9.2\" height=\"9.2\" fill=\"#9f1239\"/>",
    unknown: "<circle cx=\"7\" cy=\"7\" r=\"5\" fill=\"none\" stroke=\"#475569\" stroke-width=\"1.3\"/><text x=\"7\" y=\"10.2\" text-anchor=\"middle\" font-size=\"9\" font-family=\"system-ui,sans-serif\" fill=\"#475569\">?</text>",
    doubt: "<path fill=\"none\" stroke=\"#8a5d00\" stroke-width=\"1.4\" d=\"M7 2.2 L12.2 12 H1.8 Z\"/>",
    nodata: "<circle cx=\"7\" cy=\"7\" r=\"4.4\" fill=\"none\" stroke=\"#475569\" stroke-width=\"1.4\" stroke-dasharray=\"2 1.5\"/>",
    out: "<rect x=\"2.6\" y=\"2.6\" width=\"8.8\" height=\"8.8\" fill=\"none\" stroke=\"#475569\" stroke-width=\"1.4\"/>"
  };
  return "<svg class=\"ic\" viewBox=\"0 0 14 14\" aria-hidden=\"true\">" + p[kind] + "</svg>";
}
function makeRope(id) {
  var rnd = lcg(id * 10007 + 17);
  var runsLma = [[], [], [], []];
  var i, s, m, mid, first, grow, midc, faults, f, ld, runs, gaps, tags;
  for (i = 0; i < 51; i++) {
    m = i * 5;
    mid = Math.exp(-((m - 125) * (m - 125)) / (70 * 70));
    first = 0.3 + mid * 0.8 + rnd() * 0.12;
    grow = 0.12 + mid * 0.45 + rnd() * 0.08;
    for (s = 0; s < 4; s++) runsLma[s].push(Math.round((first + grow * s / 3) * 100) / 100);
  }
  var cycles = [];
  for (i = 0; i < 25; i++) {
    midc = Math.exp(-((i - 12) * (i - 12)) / 36);
    cycles.push(Math.round(8000 + rnd() * 14000 + midc * (16000 + rnd() * 22000)));
  }
  faults = [];
  if (rnd() < 0.33) {
    faults.push({
      m: Math.round((20 + rnd() * 210) * 10) / 10,
      pct: Math.round((0.3 + rnd() * 1.2) * 10) / 10,
      onFirst: rnd() < 0.6
    });
  }
  gaps = [1500 + (id * 17) % 500, 800 + (id * 13) % 280, 240 + (id * 9) % 140, 4 + (id % 18)];
  tags = ["First run", "Later run", "Later run", "Latest"];
  runs = [];
  for (s = 0; s < 4; s++) {
    ld = [];
    for (f = 0; f < faults.length; f++) if (faults[f].onFirst || s === 3) ld.push(faults[f]);
    runs.push({ label: dateLabel(gaps[s]), tag: tags[s], lma: runsLma[s], ld: ld });
  }
  return { id: id, sws: ["sound", "sound"], cycles: cycles, runs: runs };
}
function forcePeak(arr, atM, widthM, peak) {
  var i, d, t;
  for (i = 0; i < arr.length; i++) {
    d = Math.abs(i * 5 - atM);
    if (d <= widthM) {
      t = peak * (1 - d / widthM) + arr[i] * (d / widthM);
      if (t > arr[i]) arr[i] = Math.round(t * 100) / 100;
    }
  }
}
function clearLd(r) {
  var i;
  for (i = 0; i < r.runs.length; i++) r.runs[i].ld = [];
}
function addLd(r, from, fault) {
  var i;
  for (i = from; i < r.runs.length; i++) r.runs[i].ld.push(fault);
}
function hump(center, base, extra) {
  var a = [], i, mid;
  for (i = 0; i < 25; i++) {
    mid = Math.exp(-((i - center) * (i - center)) / (4.5 * 4.5));
    a.push(Math.round(base + extra * mid));
  }
  return a;
}
function applyStories(list) {
  var r, i, peaks;
  r = list[6];
  clearLd(r);
  peaks = [6.2, 8.0, 9.6, 11.2];
  for (i = 0; i < 4; i++) forcePeak(r.runs[i].lma, 80, 30, peaks[i]);
  addLd(r, 0, { m: 86, pct: 1.2, onFirst: true });
  addLd(r, 3, { m: 78, pct: 3.1, onFirst: false });
  r.cycles = hump(8, 15000, 170000);
  r = list[26];
  clearLd(r);
  peaks = [5.2, 6.4, 7.4, 8.4];
  for (i = 0; i < 4; i++) forcePeak(r.runs[i].lma, 160, 28, peaks[i]);
  r = list[13];
  clearLd(r);
  forcePeak(r.runs[2].lma, 190, 24, 4.4);
  forcePeak(r.runs[3].lma, 190, 24, 6.2);
  addLd(r, 3, { m: 188, pct: 4.8, onFirst: false });
  r = list[2];
  clearLd(r);
  forcePeak(r.runs[0].lma, 110, 36, 1.4);
  forcePeak(r.runs[1].lma, 110, 36, 2.4);
  forcePeak(r.runs[2].lma, 110, 36, 3.6);
  forcePeak(r.runs[3].lma, 110, 36, 4.8);
  r = list[7];
  clearLd(r);
  addLd(r, 3, { m: 210, pct: 2.4, onFirst: false });
  r = list[47];
  clearLd(r);
  addLd(r, 3, { m: 40.0, pct: 5.5, onFirst: false });
  addLd(r, 3, { m: 40.6, pct: 3.2, onFirst: false });
  addLd(r, 3, { m: 41.2, pct: 2.6, onFirst: false });
  r = list[21];
  clearLd(r);
  r.cycles = hump(14, 20000, 200000);
  list[18].sws = ["doubt", "sound"];
  list[32].sws = ["sound", "out"];
  list[40].sws = ["nodata", "nodata"];
}
var ropes = [];
var ri;
for (ri = 1; ri <= 51; ri++) ropes.push(makeRope(ri));
applyStories(ropes);

function hasMetal(r) {
  var i;
  for (i = 0; i < r.sws.length; i++) if (r.sws[i] === "sound" || r.sws[i] === "doubt") return true;
  return false;
}
function maxNum(arr) {
  var m = arr[0], i;
  for (i = 1; i < arr.length; i++) if (arr[i] > m) m = arr[i];
  return m;
}
function maxLd(run) {
  var m = 0, i;
  for (i = 0; i < run.ld.length; i++) if (run.ld[i].pct > m) m = run.ld[i].pct;
  return m;
}
function maxRise(r, run) {
  var a = r.runs[0].lma, b = run.lma, m = 0, i, d;
  for (i = 0; i < a.length; i++) {
    d = b[i] - a[i];
    if (d > m) m = d;
  }
  return m;
}
function newCount(run) {
  var n = 0, i;
  for (i = 0; i < run.ld.length; i++) if (!run.ld[i].onFirst) n++;
  return n;
}
function levelOf(r) {
  var run, lma, drift, ld;
  if (!hasMetal(r)) return "unknown";
  run = r.runs[3];
  lma = maxNum(run.lma);
  drift = maxRise(r, run);
  ld = maxLd(run);
  if (lma >= 10) return "discard";
  if (lma >= 7 || drift >= 7 || ld >= 4) return "inspect";
  if (lma >= 4 || drift >= 4 || ld >= 2) return "watch";
  return "quiet";
}
function equipOf(sws) {
  var rank = { sound: 0, doubt: 1, out: 2, nodata: 3 };
  return rank[sws[1]] > rank[sws[0]] ? sws[1] : sws[0];
}
function fatigueOf(r) {
  var run, v;
  if (!hasMetal(r)) return null;
  run = r.runs[3];
  v = maxNum(r.cycles) / 2800 + maxNum(run.lma) * 2 + maxLd(run);
  if (v > 99) v = 99;
  if (v < 0) v = 0;
  return Math.round(v);
}
function busiest(r) {
  var i, b = 0;
  for (i = 1; i < r.cycles.length; i++) if (r.cycles[i] > r.cycles[b]) b = i;
  return { i: b, n: r.cycles[b], a: b * 10, z: b * 10 + 10 };
}
function findRope(id) {
  var i;
  for (i = 0; i < ropes.length; i++) if (ropes[i].id === id) return ropes[i];
  return ropes[0];
}
function ordered() {
  var list = ropes.slice();
  if (order === "concern") {
    list.sort(function (a, b) {
      var d = RANK[levelOf(a)] - RANK[levelOf(b)];
      return d ? d : a.id - b.id;
    });
  }
  return list;
}
function countAll() {
  var c = { quiet: 0, watch: 0, inspect: 0, discard: 0, unknown: 0, heads: 0 };
  var i, s;
  for (i = 0; i < ropes.length; i++) {
    c[levelOf(ropes[i])]++;
    for (s = 0; s < 2; s++) if (ropes[i].sws[s] !== "sound") c.heads++;
  }
  return c;
}
function pill(kind, text) {
  return "<span class=\"pill\">" + icon(kind) + esc(text) + "</span>";
}
function renderFleet() {
  var c = countAll();
  var list = ordered();
  var html = "";
  var i, r, lv, eq, fat, drift, faults, cyc, label;
  html += "<header>";
  html += "<strong>Fleet</strong>";
  html += "<span>51 ropes \u00b7 102 SWS</span>";
  html += "<span class=\"stop\">Does not stop the winch</span>";
  html += "<label>Order <select id=\"order\">";
  html += "<option value=\"place\"" + (order === "place" ? " selected" : "") + ">Winch number</option>";
  html += "<option value=\"concern\"" + (order === "concern" ? " selected" : "") + ">Concerns first</option>";
  html += "</select></label>";
  html += "<span class=\"hcounts\">";
  html += pill("discard", " Discard guide " + c.discard);
  html += pill("unknown", " Unknown " + c.unknown);
  html += pill("inspect", " Inspect " + c.inspect);
  html += pill("watch", " Watch " + c.watch);
  html += pill("quiet", " Quiet " + c.quiet);
  html += "<span class=\"pill\">" + c.heads + " heads not sound</span>";
  html += "</span></header>";
  html += "<p class=\"key\">Each row: rope level, equipment, then A and B (the two SWS), fatigue placeholder, drift (largest loss-of-metal rise since the first run, percentage points), new local faults, cycles on the busiest 10 m. 10 m is a placeholder. Fatigue does not set the level. Curves, fault positions, channels and temperatures are on later views. Invented readings.</p>";
  html += "<div class=\"grid\" role=\"list\">";
  for (i = 0; i < list.length; i++) {
    r = list[i];
    lv = levelOf(r);
    eq = equipOf(r.sws);
    fat = fatigueOf(r);
    drift = hasMetal(r) ? maxRise(r, r.runs[3]) : null;
    faults = hasMetal(r) ? newCount(r.runs[3]) : null;
    cyc = maxNum(r.cycles);
    label = "Winch " + pad(r.id) + ", " + LEVEL_WORD[lv] + ", equipment " + EQUIP_WORD[eq] + ". Open the rope.";
    html += "<button type=\"button\" class=\"card lv-" + lv + (eq === "sound" ? "" : " eq-bad") + "\" data-id=\"" + r.id + "\" title=\"" + esc(label) + "\" aria-label=\"" + esc(label) + "\">";
    html += "<span class=\"top\"><span class=\"name\">Winch " + pad(r.id) + "</span>";
    html += "<span class=\"lv\">" + icon(lv) + LEVEL_WORD[lv] + "</span><span class=\"spacer\"></span>";
    html += "<span class=\"eq c-" + eq + "\">" + icon(eq === "sound" ? "sound" : eq) + EQUIP_WORD[eq] + "</span></span>";
    html += "<span class=\"bot\">";
    html += "<span title=\"SWS A " + EQUIP_WORD[r.sws[0]] + "\">A " + icon(r.sws[0] === "sound" ? "sound" : r.sws[0]) + "</span>";
    html += "<span title=\"SWS B " + EQUIP_WORD[r.sws[1]] + "\">B " + icon(r.sws[1] === "sound" ? "sound" : r.sws[1]) + "</span>";
    html += "<span title=\"Placeholder index. Formula not settled. Not a rope level.\">Fatigue " + (fat === null ? "\u2014" : fat) + "</span>";
    html += "<span>Drift " + fmtDrift(drift) + "</span>";
    html += "<span>New faults " + (faults === null ? "\u2014" : faults) + "</span>";
    html += "<span>Cycles " + fmtCyc(cyc) + "</span>";
    html += "</span></button>";
  }
  html += "</div>";
  return html;
}
function plotSvg(r, idx) {
  var L = 92, R = 948, H = 548;
  var bands = [
    { title: "Local faults", titleY: 16, plot: 32, h: 68 },
    { title: "Loss of metal %", titleY: 130, plot: 146, h: 100 },
    { title: "Drift from the first run", titleY: 276, plot: 292, h: 100 },
    { title: "Bending cycles", titleY: 422, plot: 438, h: 78 }
  ];
  var parts = [];
  var run = r.runs[idx];
  var metal = hasMetal(r);
  function xOf(m) { return L + (m / 250) * (R - L); }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function yIn(plot, h, t) { return plot + h - t * (h - 2) - 1; }
  function txt(x, y, str, anchor, size, fill) {
    return "<text x=\"" + x.toFixed(1) + "\" y=\"" + y.toFixed(1) + "\" text-anchor=\"" + anchor + "\" font-size=\"" + size + "\" fill=\"" + fill + "\">" + esc(str) + "</text>";
  }
  function frame(b) {
    var m, x;
    parts.push("<text x=\"" + L + "\" y=\"" + b.titleY + "\" font-size=\"13\" font-weight=\"650\" fill=\"#1c1917\">" + esc(b.title) + "</text>");
    parts.push("<rect x=\"" + L + "\" y=\"" + b.plot + "\" width=\"" + (R - L) + "\" height=\"" + b.h + "\" fill=\"#fff\" stroke=\"#e7e5e4\"/>");
    for (m = 0; m <= 250; m += 50) {
      x = xOf(m);
      parts.push("<line x1=\"" + x + "\" y1=\"" + b.plot + "\" x2=\"" + x + "\" y2=\"" + (b.plot + b.h) + "\" stroke=\"#eeeae4\"/>");
    }
  }
  parts.push("<svg viewBox=\"0 0 960 " + H + "\" role=\"img\" font-family=\"system-ui,sans-serif\">");
  parts.push("<title>Winch " + pad(r.id) + " along 250 m</title>");
  frame(bands[0]); frame(bands[1]); frame(bands[2]); frame(bands[3]);
  parts.push(txt(L + 6, bands[0].plot + 14, "end switch", "start", 11, "#78716c"));
  parts.push(txt(R - 6, bands[0].plot + 14, "end switch", "end", 11, "#78716c"));
  if (!metal) {
    parts.push(txt(L + 12, bands[0].plot + 40, "Unknown", "start", 14, "#334155"));
    parts.push(txt(L + 12, bands[1].plot + 36, "No SWS data. Loss of metal is unknown.", "start", 14, "#334155"));
    parts.push(txt(L + 12, bands[2].plot + 36, "Drift is unknown without SWS data.", "start", 14, "#334155"));
  } else {
    var base = bands[0].plot + bands[0].h - 8;
    var list = run.ld.slice().sort(function (a, b) { return a.m - b.m; });
    var i, f, x, stem, yTop, bits, j;
    if (!list.length) parts.push(txt(L + 10, bands[0].plot + 36, "None on this run", "start", 13, "#78716c"));
    for (i = 0; i < list.length; i++) {
      f = list[i];
      x = xOf(f.m);
      stem = Math.min(bands[0].h - 26, 10 + f.pct * 9);
      yTop = base - stem;
      parts.push("<line x1=\"" + x + "\" y1=\"" + base + "\" x2=\"" + x + "\" y2=\"" + yTop + "\" stroke=\"#9f1239\" stroke-width=\"2\"/>");
      if (f.onFirst) {
        parts.push("<circle cx=\"" + x + "\" cy=\"" + yTop + "\" r=\"3.5\" fill=\"#9f1239\"><title>" + f.m + " m, " + f.pct + "% of steel area, on the first run</title></circle>");
      } else {
        parts.push("<circle cx=\"" + x + "\" cy=\"" + yTop + "\" r=\"3.5\" fill=\"#fff\" stroke=\"#9f1239\" stroke-width=\"1.5\"><title>" + f.m + " m, " + f.pct + "% of steel area, new since the first run</title></circle>");
      }
    }
    i = 0;
    while (i < list.length) {
      if (list[i].pct >= 2) {
        bits = [];
        j = i;
        while (j < list.length && list[j].m - list[i].m <= 8 && list[j].pct >= 2) {
          bits.push(String(list[j].pct));
          j++;
        }
        stem = Math.min(bands[0].h - 26, 10 + list[i].pct * 9);
        parts.push(txt(xOf(list[i].m), base - stem - 6, bits.join(" \u00b7 "), "middle", 11, "#9f1239"));
        i = j;
      } else i++;
    }
    var yL = function (v) { return yIn(bands[1].plot, bands[1].h, clamp(v, 0, 12) / 12); };
    var yD = function (v) { return yIn(bands[2].plot, bands[2].h, (clamp(v, -2, 12) + 2) / 14); };
    var pts = [], poly = [], area = [], k, yBase, y10, y0, driftPts;
    yBase = yL(0);
    area.push(xOf(0).toFixed(1) + "," + yBase.toFixed(1));
    for (k = 0; k < run.lma.length; k++) {
      poly.push(xOf(k * 5).toFixed(1) + "," + yL(r.runs[0].lma[k]).toFixed(1));
      pts.push(xOf(k * 5).toFixed(1) + "," + yL(run.lma[k]).toFixed(1));
      area.push(xOf(k * 5).toFixed(1) + "," + yL(run.lma[k]).toFixed(1));
    }
    area.push(xOf(250).toFixed(1) + "," + yBase.toFixed(1));
    parts.push("<polygon points=\"" + area.join(" ") + "\" fill=\"#d9e6f5\"/>");
    parts.push("<polyline fill=\"none\" stroke=\"#8a847c\" stroke-width=\"1.5\" points=\"" + poly.join(" ") + "\"/>");
    parts.push("<polyline fill=\"none\" stroke=\"#1e4e89\" stroke-width=\"2\" points=\"" + pts.join(" ") + "\"/>");
    y10 = yL(10);
    parts.push("<line x1=\"" + L + "\" y1=\"" + y10 + "\" x2=\"" + R + "\" y2=\"" + y10 + "\" stroke=\"#9f1239\" stroke-dasharray=\"4 3\"/>");
    parts.push(txt(L + 6, y10 - 4, "10% owner", "start", 11, "#9f1239"));
    parts.push(txt(L - 8, yL(10), "10", "end", 11, "#57534e"));
    parts.push(txt(L - 8, yL(5), "5", "end", 11, "#57534e"));
    parts.push(txt(L - 8, yL(0) - 2, "0", "end", 11, "#57534e"));
    y0 = yD(0);
    parts.push("<line x1=\"" + L + "\" y1=\"" + y0 + "\" x2=\"" + R + "\" y2=\"" + y0 + "\" stroke=\"#d6d3d1\"/>");
    if (idx === 0) {
      parts.push(txt(L + 10, bands[2].plot + 28, "This is the reference. Drift is zero.", "start", 13, "#6d28d9"));
    } else {
      driftPts = [];
      for (k = 0; k < run.lma.length; k++) driftPts.push(xOf(k * 5).toFixed(1) + "," + yD(run.lma[k] - r.runs[0].lma[k]).toFixed(1));
      parts.push("<polyline fill=\"none\" stroke=\"#6d28d9\" stroke-width=\"2\" points=\"" + driftPts.join(" ") + "\"/>");
    }
    parts.push(txt(L - 8, yD(10), "10", "end", 11, "#57534e"));
    parts.push(txt(L - 8, yD(5), "5", "end", 11, "#57534e"));
    parts.push(txt(L - 8, yD(0), "0", "end", 11, "#57534e"));
    parts.push(txt(L - 8, yD(-2), "-2", "end", 11, "#57534e"));
  }
  var maxC = maxNum(r.cycles);
  var hot = busiest(r).i;
  var slot = (R - L) / 25;
  var bi, bh, bx, by, bw;
  if (maxC < 1) maxC = 1;
  for (bi = 0; bi < 25; bi++) {
    bw = slot * 0.72;
    bx = xOf(bi * 10) + slot * 0.14;
    bh = (r.cycles[bi] / maxC) * (bands[3].h - 6);
    by = bands[3].plot + bands[3].h - bh - 1;
    parts.push("<rect x=\"" + bx.toFixed(1) + "\" y=\"" + by.toFixed(1) + "\" width=\"" + bw.toFixed(1) + "\" height=\"" + bh.toFixed(1) + "\" fill=\"" + (bi === hot ? "#1c4532" : "#4d7c5a") + "\"><title>" + (bi * 10) + "-" + (bi * 10 + 10) + " m, " + fmtFull(r.cycles[bi]) + " cycles, invented</title></rect>");
  }
  parts.push(txt(L - 8, bands[3].plot + 10, fmtCyc(maxC), "end", 11, "#57534e"));
  parts.push(txt(L - 8, bands[3].plot + bands[3].h - 2, "0", "end", 11, "#57534e"));
  var tick;
  for (tick = 0; tick <= 250; tick += 50) {
    parts.push(txt(xOf(tick), 534, tick + " m", tick === 0 ? "start" : (tick === 250 ? "end" : "middle"), 12, "#44403c"));
  }
  parts.push("</svg>");
  return parts.join("");
}
function renderRope() {
  var r = findRope(openId);
  var lv = levelOf(r);
  var eq = equipOf(r.sws);
  var idx = runPick;
  if (idx < 0 || idx > 3) idx = 3;
  var run = r.runs[idx];
  var metal = hasMetal(r);
  var fat = fatigueOf(r);
  var b = busiest(r);
  var html = "";
  var i;
  html += "<header>";
  html += "<button type=\"button\" id=\"back\">All 51 ropes</button>";
  html += "<strong>Winch " + pad(r.id) + "</strong>";
  html += "<span class=\"lv c-" + (lv === "quiet" ? "sound" : lv) + "\">" + icon(lv) + LEVEL_WORD[lv] + "</span>";
  html += "<span class=\"eq c-" + eq + "\">" + icon(eq === "sound" ? "sound" : eq) + EQUIP_WORD[eq] + "</span>";
  html += "<span class=\"stop\">Does not stop the winch</span>";
  html += "<span class=\"muted\">Level is from the latest run</span>";
  html += "</header>";
  html += "<div class=\"rmeta\">";
  html += "<span title=\"Invented index from the latest run: busiest cycles / 2800 + 2 x peak loss of metal + largest local fault, cap 99. Not a rope level.\">Fatigue placeholder " + (fat === null ? "\u2014" : fat) + "</span>";
  if (metal) {
    html += "<span>This run peak loss of metal " + maxNum(run.lma).toFixed(1) + "%</span>";
    html += "<span>Drift " + fmtDrift(maxRise(r, run)) + "</span>";
    html += "<span>New faults " + newCount(run) + "</span>";
  } else {
    html += "<span>Peak loss of metal \u2014</span><span>Drift \u2014</span><span>New faults \u2014</span>";
  }
  html += "<span>Busiest " + b.a + "-" + b.z + " m: " + fmtFull(b.n) + " cycles</span>";
  html += "<span>SWS A " + EQUIP_WORD[r.sws[0]] + "</span>";
  html += "<span>SWS B " + EQUIP_WORD[r.sws[1]] + "</span>";
  html += "</div>";
  if (metal) {
    html += "<div class=\"runs\" role=\"group\" aria-label=\"Runs\">";
    for (i = 0; i < r.runs.length; i++) {
      html += "<button type=\"button\" class=\"run\" data-i=\"" + i + "\" aria-pressed=\"" + (i === idx ? "true" : "false") + "\">" + esc(r.runs[i].tag + " \u00b7 " + r.runs[i].label) + "</button>";
    }
    html += "</div>";
  } else {
    html += "<p class=\"note\">No SWS runs. Bending cycles still come from the winch.</p>";
  }
  html += "<p class=\"legend\">Stems are local faults, longer when larger, drawn as percent of steel area (unit assumed). Hollow head: not on the first run. Blue: loss of metal on the selected run. Grey: first run. Purple: drift since the first run. Green bars: bending cycles per 10 m (placeholder width). Dashed line: owner's 10% rule. At the assumed 52 mm, 6 diameters are about 0.31 m and 30 about 1.56 m. ISO length tests are not drawn. Fatigue placeholder = busiest cycles / 2800 + 2 x peak loss of metal + largest local fault, cap 99.</p>";
  if (NOTES[r.id]) html += "<p class=\"note\">" + esc(NOTES[r.id]) + "</p>";
  html += "<div class=\"chart\">" + plotSvg(r, metal ? idx : 3) + "</div>";
  return html;
}
function render() {
  var app = document.getElementById("app");
  app.innerHTML = mode === "rope" ? renderRope() : renderFleet();
  var cards = app.querySelectorAll(".card");
  var i;
  for (i = 0; i < cards.length; i++) {
    cards[i].onclick = function () {
      openId = Number(this.getAttribute("data-id"));
      runPick = 3;
      mode = "rope";
      render();
    };
  }
  var back = document.getElementById("back");
  if (back) back.onclick = function () { mode = "fleet"; render(); };
  var sel = document.getElementById("order");
  if (sel) sel.onchange = function () { order = this.value; render(); };
  var runs = app.querySelectorAll(".run");
  for (i = 0; i < runs.length; i++) {
    runs[i].onclick = function () {
      runPick = Number(this.getAttribute("data-i"));
      render();
    };
  }
}
render();
</script>
