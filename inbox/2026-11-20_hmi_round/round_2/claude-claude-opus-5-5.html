 s+='<text x="2" y="'+(yAx+fs*1.6)+'" class="tu">Position along rope, m</text>';
 s+='<line id="xh" class="xh" x1="0" x2="0" y1="0" y2="'+yAx+'" visibility="hidden"/><rect id="hit" x="'+x0+'" y="0" width="'+(x1-x0)+'" height="'+yAx+'" fill="transparent"/></svg>';
 box.innerHTML=s;
 const svg=box.querySelector('svg'),xh=svg.querySelector('#xh'),hit=svg.querySelector('#hit');
 hit.addEventListener('pointermove',e=>{const rc=svg.getBoundingClientRect(),p=Math.max(0,Math.min(L,(e.clientX-rc.left-x0)/(x1-x0)*L)),xx=X(p);xh.setAttribute('x1',xx);xh.setAttribute('x2',xx);xh.setAttribute('visibility','visible');readout(p)});
 hit.addEventListener('pointerleave',()=>xh.setAttribute('visibility','hidden'))}
function readout(p){const d=gen(cur),el=document.getElementById('read');if(!el)return;
 const xi=Math.round(p),sec=Math.min(NS-1,Math.floor(p/SEC)),lt=d.latest[xi],fi=d.first[xi];
 const by=d.seenBy(xi).map(k=>'SWS '+k).join(' + ')||'no SWS (no data)';
 const ni=d.ind.filter(f=>Math.abs(f.p-p)<=2),nf=d.F.filter(f=>Math.abs(f.p-p)<=2);
 el.innerHTML='<b>At '+p.toFixed(1)+' m</b><br>Loss of metal, latest: '+(isNaN(lt)?'no data':lt.toFixed(1)+' %')+' · first run '+fi.toFixed(1)+' %<br>Change since first run: '+(isNaN(lt)||d.R<2?'—':(lt-fi>=0?'+':'')+(lt-fi).toFixed(1)+' pp')+'<br>Bending cycles, '+sec*SEC+'–'+(sec*SEC+SEC)+' m: '+(d.cycSt==='none'?'no data':d.cyc[sec].toLocaleString('en-US')+(d.cycSt==='late'?' (as of '+CYCLATE+')':''))+' <span class="dim">(alignment assumed)</span><br>Seen by: '+by+(ni.length?'<br>LD indication: '+ni.map(f=>f.v.toFixed(1)+' % at '+f.p+' m').join(', '):'')+(nf.length?'<br>Finding: '+nf.map(f=>f.k+' '+f.worst.toFixed(1)+' % '+(f.dis?'(dismissed)':'(active)')).join('; '):'');
 el.classList.remove('dim')}
function setTheme(t){document.documentElement.setAttribute('data-obc-theme',t);document.querySelectorAll('button[data-t]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.t===t))}
function setConcern(c){document.documentElement.setAttribute('data-concern',c);document.querySelectorAll('button[data-c]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===c))}
function applyOpts(o){if(o.t&&THEMES.includes(o.t))setTheme(o.t);if(o.c)setConcern(o.c==='alarm'?'alarm':'warning')}
function hashOpts(){const o={t:null,c:null,r:null};location.hash.replace(/^#/,'').split('&').forEach(p=>{let m;if((m=p.match(/^theme=(\w+)$/)))o.t=m[1];else if((m=p.match(/^concern=(\w+)$/)))o.c=m[1];else if((m=p.match(/^rope\/(\d+)$/)))o.r=+m[1]});return o}
function route(){const o=hashOpts();applyOpts(o);const ov=document.getElementById('ov'),rp=document.getElementById('rope');
 if(o.r&&o.r>=1&&o.r<=N){cur=o.r;ov.hidden=true;rp.hidden=false;document.getElementById('h1').textContent='Rope view – '+gen(cur).name;renderRope()}
 else{rp.hidden=true;ov.hidden=false;document.getElementById('h1').textContent='Rope condition – all 51 ropes';renderOv()}
 window.scrollTo(0,0)}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-t],button[data-c]');if(!b)return;if(b.dataset.t)setTheme(b.dataset.t);else setConcern(b.dataset.c)});
window.addEventListener('hashchange',route);
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(!document.getElementById('rope').hidden)drawRope()},150)});
document.addEventListener('keydown',e=>{const inRope=!document.getElementById('rope').hidden;
 if(e.key==='Escape')go('');
 else if(inRope&&e.key==='ArrowRight')go('#rope/'+(cur%N+1));
 else if(inRope&&e.key==='ArrowLeft')go('#rope/'+(cur===1?N:cur-1))});
document.getElementById('asof').textContent='SWS data as of 2026-11-20 05:52 · invented data';
setTheme(document.documentElement.getAttribute('data-obc-theme'));setConcern('warning');
(function(){const q=new URLSearchParams(location.search);applyOpts({t:q.get('theme'),c:q.get('concern')})})();
route();
</script>
