ta-key="f-inside" aria-pressed="true"><svg viewBox="0 0 34 12" aria-hidden="true"><line x1="1" y1="6" x2="33" y2="6" stroke="var(--green)" stroke-width="1.8"/></svg>Inside ±20 mT (shading)</button><button type="button" class="plt-key" data-key="f-zero" aria-pressed="true"><svg viewBox="0 0 34 12" aria-hidden="true"><line x1="1" y1="6" x2="33" y2="6" stroke="var(--fg)" stroke-width="2.0" stroke-dasharray="7 4"/></svg>Standing field zero (dashed)</button><button type="button" class="plt-key" data-key="f-lev" aria-pressed="true"><svg viewBox="0 0 34 12" aria-hidden="true"><line x1="1" y1="6" x2="33" y2="6" stroke="var(--blue)" stroke-width="1.1"/></svg>Equal long-loss level (top row)</button><button type="button" class="plt-key" data-key="f-app" aria-pressed="true"><svg viewBox="0 0 34 12" aria-hidden="true"><line x1="1" y1="6" x2="33" y2="6" stroke="var(--vermillion)" stroke-width="1.1"/></svg>Equal mistaken change of metal (bottom row)</button><button type="button" class="plt-key" data-key="f-rope" aria-pressed="true"><svg viewBox="0 0 34 12" aria-hidden="true"><line x1="1" y1="6" x2="33" y2="6" stroke="var(--grey)" stroke-width="1.6"/></svg>Rope below 1.9 T (grey line)</button></div><div class="plt-text"><h4>About this plot</h4><p>Each panel is one groove shape, cut all the way round in the yoke&#x27;s outer or inner face (the inner face is towards the rope), 10 or 20 mm wide; across: groove depth, from 0 (no groove) to 8 mm in an 8.5 mm thick yoke; up: lift-off, the sensor part&#x27;s distance from the rope surface, in millimetres. Top row: the long-loss level, the steady change of B_z (the field along the rope, read at the head&#x27;s middle cross-section, the mid-plane) for each 1 % of metal lost evenly over 300 mm of rope, a long loss as opposed to a short fault; bottom row: the change of metal that magnets 1 % weaker would be mistaken for. Look along the dashed line, where the standing field is zero, inside the green shading, where it is within the sensor part&#x27;s ±20 mT range: there the long-loss reading is larger than at the same lift-off without a groove, and magnets 1 % weaker (a drift of the magnets) are mistaken for little metal. Left of the grey line the rope still runs at 1.9 T or more at the mid-plane; right of it, less. The head is a ring of magnets in a steel shell (the yoke) round the rope; calculated, not measured: a two-dimensional, round-symmetric computer model of the head sized for a 40 mm rope, with a 40 mm rope in it, assumed (not measured) steel and magnet data, 25 °C, the magnet not made stronger to make up for a cut. Mid-plane only; the losses are rings of lost metal, not broken wires.</p><h4>What each line, band and mark is</h4><dl><dt>Inside ±20 mT (shading)</dt><dd>The standing field, with an intact rope, is within ±20 mT here: the range the sensor part is specified for when read through its package. The edge is interpolated between the computed points, as the values at the pointer are.</dd><dt>Standing field zero (dashed)</dt><dd>Where the standing field B_z is zero. A deeper groove brings this line nearer the rope.</dd><dt>Equal long-loss level (top row)</dt><dd>Each solid line joins places with the same long-loss level per 1 % of metal lost, in mT; the number on the line is the level. Larger in size is a stronger reading; negative means B_z moves in the negative direction.</dd><dt>Equal mistaken change of metal (bottom row)</dt><dd>Each solid line joins places where magnets 1 % weaker would be read as the same change of metal, in % (the number on the line). Near 0: the drift is mistaken for little metal; negative: read as metal gained; positive: as metal lost.</dd><dt>Rope below 1.9 T (grey line)</dt><dd>From this groove depth on, the rope at the mid-plane carries less than 1.9 T, the bottom of the 1.9 to 2.3 T window set for the rope in the project&#x27;s data register; the magnet was not made stronger to make up.</dd></dl><p>Values at the pointer are interpolated between the computed points (depth in 0.5 mm steps, lift-off in 0.5 mm steps from 3.0 to 22.5 mm); the arrow keys step through the computed points themselves.</p><p class="plt-src">Source of the numbers: sws/3d/results/groove_physics_H40_d40_hard_+25C_sweep.json, the same file as the static figure sws/3d/figures/groove_physics_map.png; explanations in sws/3d/demo/interactive_figures.py.</p></div><script type="application/json" class="plt-data">{"kind":"map","about":["Each panel is one groove shape, cut all the way round in the yoke's outer or inner face (the inner face is towards the rope), 10 or 20 mm wide; across: groove depth, from 0 (no groove) to 8 mm in an 8.5 mm thick yoke; up: lift-off, the sensor part's distance from the rope surface, in millimetres.","Top row: the long-loss level, the steady change of B_z (the field along the rope, read at the head's middle cross-section, the mid-plane) for each 1 % of metal lost evenly over 300 mm of rope, a long loss as opposed to a short fault; bottom row: the change of metal that magnets 1 % weaker would be mistaken for.","Look along the dashed line, where the standing field is zero, inside the green shading, where it is within the sensor part's ±20 mT range: there the long-loss reading is larger than at the same lift-off without a groove, and magnets 1 % weaker (a drift of the magnets) are mistaken for little metal.","Left of the grey line the rope still runs at 1.9 T or more at the mid-plane; right of it, less.","The head is a ring of magnets in a steel shell (the yoke) round the rope; calculated, not measured: a two-dimensional, round-symmetric computer model of the head sized for a 40 mm rope, with a 40 mm rope in it, assumed (not measured) steel and magnet data, 25 °C, the magnet not made stronger to make up for a cut. Mid-plane only; the losses are rings of lost metal, not broken wires."],"x":{"name":"depth","unit":"mm","dp":2},"y":{"name":"lift-off","unit":"mm","dp":1},"frame":{"l":44,"t":8,"w":236,"h":210,"r":8,"b":40},"panels":[{"title var keys=F.querySelectorAll('.plt-key');
function item(k){return D.items[k]}
function vis(k){var e=F.querySelector('[data-k="'+((D.items[k]&&D.items[k].group)||k)+'"]');return!!e&&!e.classList.contains('off')}
keys.forEach(function(b){var k=b.dataset.key,it=item(k);
 function show(){var r=b.getBoundingClientRect();F.querySelectorAll('[data-k="'+k+'"]').forEach(function(g){g.classList.add('hi')});
  tip('<b>'+esc(it.name)+(b.getAttribute('aria-pressed')==='false'?' (now hidden; select again to show)':'')+'</b>'+esc(it.explain)+
  (it.kind==='series'&&D.kind==='line'?'<span class="v">Arrow keys: read the values along this curve. Enter: hide or show.</span>':''),r.left,r.bottom)}
 b.addEventListener('mouseenter',show);b.addEventListener('focus',show);b.addEventListener('mouseleave',hide);b.addEventListener('blur',hide);
 b.addEventListener('click',function(e){e.stopPropagation();var on=b.getAttribute('aria-pressed')!=='false';b.setAttribute('aria-pressed',on?'false':'true');
  F.querySelectorAll('[data-k="'+k+'"]').forEach(function(g){g.classList.toggle('off',on)});hide();show()});
 if(D.kind==='line'&&it.kind==='series'){var j=-1;b.addEventListener('keydown',function(e){if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;
  e.preventDefault();if(b.getAttribute('aria-pressed')==='false')return;var P=D.frame,ok=[];for(var i=0;i<it.x.length;i++){if(it.x[i]>=P.x0&&it.x[i]<=P.x1&&it.y[i]!==null&&it.y[i]>=P.y0&&it.y[i]<=P.y1)ok.push(i)}if(!ok.length)return;var n=ok.length;j=j<0?0:Math.max(0,Math.min(n-1,j+(e.key==='ArrowRight'?1:-1)));var jj=ok[j];
  var svg=F.querySelector('svg.plt-main');var X=P.l+(it.x[jj]-P.x0)/(P.x1-P.x0)*P.w,Y=P.t+(P.y1-it.y[jj])/(P.y1-P.y0)*P.h;
  cursor(X,Y);var s=scr(svg,X,Y);tip('<b>'+esc(it.name)+'</b>'+esc(it.explain)+'<span class="v">'+esc(D.x.name)+' '+f(it.x[jj],D.x.dp)+' '+esc(D.x.unit)+': '+
  esc(D.y.name)+' '+f(it.y[jj],D.y.dp)+' '+esc(D.y.unit)+'</span>',s[0],s[1])})}
});
function cursor(X,Y){var c=F.querySelector('.cur'),d=F.querySelector('.curdot');if(!c)return;c.setAttribute('x1',X);c.setAttribute('x2',X);
 c.setAttribute('visibility','visible');if(Y===null){d.setAttribute('visibility','hidden')}else{d.setAttribute('cx',X);d.setAttribute('cy',Y);d.setAttribute('visibility','visible')}}
if(D.kind==='line'){
 var svg=F.querySelector('svg.plt-main'),P=D.frame;
 function at(e){var q=pt(svg,e);if(q.x<P.l||q.x>P.l+P.w||q.y<P.t||q.y>P.t+P.h){hide();return}
  var x=P.x0+(q.x-P.l)/P.w*(P.x1-P.x0),y=P.y1-(q.y-P.t)/P.h*(P.y1-P.y0),best=null,bd=1e9;
  F.querySelectorAll('.hi').forEach(function(g){g.classList.remove('hi')});
  Object.keys(D.items).forEach(function(k){var it=D.items[k];if(!vis(k))return;
   if(it.kind==='point'){var X=P.l+(it.x-P.x0)/(P.x1-P.x0)*P.w,Y=P.t+(P.y1-it.y)/(P.y1-P.y0)*P.h,dd=Math.hypot(X-q.x,Y-q.y)-4;if(dd<bd){bd=dd;best=[k,it.y,X]}}
   if(it.kind==='series'){var v=interp(it.x,it.y,x);if(v===null)return;var Y=P.t+(P.y1-v)/(P.y1-P.y0)*P.h,dd=Math.abs(Y-q.y);if(dd<bd){bd=dd;best=[k,v,null]}}});
  var unit=' '+esc(D.y.unit),xs=esc(D.x.name)+' '+f(x,D.x.dp)+' '+esc(D.x.unit);
  if(best&&bd<16){var it=D.items[best[0]];F.querySelectorAll('[data-k="'+(it.group||best[0])+'"]').forEach(function(g){g.classList.add('hi')});
   if(it.kind==='point'){tip('<b>'+esc(it.name)+'</b>'+esc(it.explain)+'<span class="v">'+esc(D.x.name)+' '+f(it.x,D.x.dp)+' '+esc(D.x.unit)+'</span>',e.clientX,e.clientY);return}
   var Y=P.t+(P.y1-best[1])/(P.y1-P.y0)*P.h;cursor(q.x,Y);
   tip('<b>'+esc(it.name)+'</b>'+esc(it.explain)+'<span class="v">'+xs+': '+esc(D.y.name)+' '+f(best[1],D.y.dp)+unit+'</span>',e.clientX,e.clientY);return}
  var h=[];Object.keys(D.items).forEach(function(k){var it=D.items[k];if(!vis(k))return;
   if(it.kind==='band'){var v=it.axis==='y'?y:x;if(v>=it.lo&&v<=it.hi)h.push('<b>'+esc(it.name)+'</b>'+esc(it.explain))}
   if(it.kind==='line'){var px=it.axis==='y'?P.t+(P.y1-it.at)/(P.y1-P.y0)*P.h:P.l+(it.at-P.x0)/(P.x1-P.x0)*P.w;
    if(Math.abs((it.axis==='y'?q.y:q.x)-px)<8)h.unshift('<b>'+esc(it.name)+'</b>'+esc(it.explain))}});
  cursor(q.x,null);
  tip((h.length?h.join('<br>'):'<b>No curve here</b>Move nearer a curve, or use the list under the plot.')+'<span class="v">Pointer: '+xs+', '+esc(D.y.name)+' '+f(y,D.y.dp)+unit+'</span>',e.clientX,e.clientY)}
 svg.addEventListener('pointermove',function(e){if(e.pointerType==='mouse'||e.pointerType==='pen')at(e)});
 svg.addEventListener('mouseleave',hide);
 svg.addEventListener('click',function(e){e.stopPropagation();at(e)});
}
if(D.kind==='map'){
 F.querySelectorAll('svg.plt-panel').forEach(function(svg){var pi=+svg.dataset.p,Pn=D.panels[pi],G=D.grids[Pn.grid],P=D.frame,ix=0,iy=0,st=0;
  function bil(Z,x,y){var X=G.x,Y=G.y;if(x<X[0]||x>X[X.length-1]||y<Y[0]||y>Y[Y.length-1])return null;var i=1,j=1;
   while(i<X.length-1&&X[i]<x)i++;while(j<Y.length-1&&Y[j]<y)j++;var tx=(x-X[i-1])/(X[i]-X[i-1]),ty=(y-Y[j-1])/(Y[j]-Y[j-1]);
   var a=Z[i-1][j-1],b=Z[i][j-1],c=Z[i-1][j],d=Z[i][j];if([a,b,c,d].some(function(v){return v===null}))return null;
   return a*(1-tx)*(1-ty)+b*tx*(1-ty)+c*(1-tx)*ty+d*tx*ty}
  function show(x,y,cx,cy){var h='<b>'+esc(Pn.title)+'</b><span class="v">'+esc(D.x.name)+' '+f(x,D.x.dp)+' '+esc(D.x.unit)+', '+esc(D.y.name)+' '+f(y,D.y.dp)+' '+esc(D.y.unit)+'</span>';
   D.values.forEach(function(v){if(v.panels&&v.panels.indexOf(Pn.row)<0)return;var z=v.along==='x'?interp(G.x,G[v.field],x):bil(G[v.field],x,y);
    h+='<span class="v">'+esc(v.name)+': '+f(z,v.dp)+(v.unit?' '+esc(v.unit):'')+(v.below!==undefined&&z!==null&&z<v.below?esc(v.below_note):'')+'</span>'});
   var inside=bil(G.inside,x,y);if(inside!==null)h+='<span class="v">'+(inside>=0.5?esc(D.inside_yes):esc(D.inside_no))+'</span>';
   h+='<span class="v" style="color:var(--muted)">'+esc(Pn.key)+'</span>';tip(h,cx,cy)}
  function at(e){var q=pt(svg,e);if(q.x<P.l||q.x>P.l+P.w||q.y<P.t||q.y>P.t+P.h){hide();return}
   var x=G.x[0]+(q.x-P.l)/P.w*(G.x[G.x.length-1]-G.x[0]),y=G.y[G.y.length-1]-(q.y-P.t)/P.h*(G.y[G.y.length-1]-G.y[0]);
   mark(svg,q.x,q.y);show(x,y,e.clientX,e.clientY)}
  svg.addEventListener('pointermove',function(e){if(e.pointerType==='mouse'||e.pointerType==='pen')at(e)});
  svg.addEventListener('mouseleave',hide);svg.addEventListener('click',function(e){e.stopPropagation();at(e)});
  svg.addEventListener('focus',function(){var r=svg.getBoundingClientRect();tip('<b>'+esc(Pn.title)+'</b>Arrow keys move a cross over the grid of computed points and read the values there.<span class="v" style="color:var(--muted)">'+esc(Pn.key)+'</span>',r.left,r.top+20)});
  svg.addEventListener('blur',hide);
  svg.addEventListener('keydown',function(e){var k=e.key;if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].indexOf(k)<0)return;e.preventDefault();
   if(st){if(k==='ArrowRight')ix=Math.min(G.x.length-1,ix+1);if(k==='ArrowLeft')ix=Math.max(0,ix-1);if(k==='ArrowUp')iy=Math.min(G.y.length-1,iy+1);if(k==='ArrowDown')iy=Math.max(0,iy-1)}st=1;
   var X=P.l+(G.x[ix]-G.x[0])/(G.x[G.x.length-1]-G.x[0])*P.w,Y=P.t+(G.y[G.y.length-1]-G.y[iy])/(G.y[G.y.length-1]-G.y[0])*P.h;mark(svg,X,Y);
   var s=scr(svg,X,Y);show(G.x[ix],G.y[iy],s[0],s[1])});
 });
 function mark(svg,X,Y){F.querySelectorAll('.curdot').forEach(function(d){d.setAttribute('visibility','hidden')});var d=svg.querySelector('.curdot');
  d.setAttribute('cx',X);d.setAttribute('cy',Y);d.setAttribute('visibility','visible')}
}
})();
</script></figure>
